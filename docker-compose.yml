services:
  defect-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEFECT_MODEL_PATH: /app/models/best.pt
      DEFECT_LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

