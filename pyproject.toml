[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-defect-detector"
version = "0.1.0"
description = "Production-oriented visual defect classification service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "matplotlib>=3.8,<4",
    "numpy>=1.24,<3",
    "pillow>=10,<12",
    "python-multipart>=0.0.9,<1",
    "scikit-learn>=1.3,<2",
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2",
    "pytest>=8,<9",
    "pytest-cov>=4,<6",
    "ruff>=0.4,<1",
    "types-Pillow>=10,<12",
]

[project.scripts]
defect-api = "defect_detector.api:run"
defect-train = "defect_detector.cli:train_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests", "testing"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(tests|testing)/"

[tool.pytest.ini_options]
testpaths = ["tests", "testing"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that exercise multiple application layers",
]

